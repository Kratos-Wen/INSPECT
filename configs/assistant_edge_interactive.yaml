video:
  stride: 1
  write_annotated: false

camera:
  detection_conf: 0.10
  detection_tta: false

detection:
  conf: 0.10
  tta: false
  use_builtin_tta: false

geometry:
  backend: moge
  moge_model: Ruicheng/moge-2-vits-normal
  use_fp16: true
  resolution_level: 9
  apply_mask: true

temporal:
  backend: counterfactual_bytetrack_lite
  window: 3
  min_confirmed_hits: 2
  preserve_current_detections: true
  identity_groups:
    - [type_7_gear, type_3_gear]
    - [type_2_gear, type_8_gear]
    - [type_6_gearbox_housing, type_5_gearbox_housing]
    - [type_6_gearbox_cover, type_5_gearbox_cover]

track_evidence:
  enabled: true

scene_evidence:
  enabled: true

scene_graph:
  enabled: true
  visibility_calibration_enabled: true

interaction:
  enabled: true

segmentation:
  backend: none
  fail_on_unavailable: false

memory:
  preset: session-only
  enabled: true
  session_enabled: true
  long_term_enabled: false
  auto_capture_enabled: true

review:
  enabled: true
  evidence_prompt_enabled: true

voice:
  enabled: true
  mode: manual
  backend: faster-whisper
  model_name: distil-small.en
  compute_type: int8_float16

speech:
  enabled: true
  backend: kokoro
  drop_pending_on_new: true
  interrupt_on_voice_input: true

assistant:
  enabled: true
  history_limit: 12
  relation_limit: 3
  overlay_chars: 120
  llm_enabled: true
  llm_provider: transformers
  llm_model_id: Qwen/Qwen3-0.6B
  # Set INSPECT_QWEN3_MODEL_PATH to use a local checkpoint without storing a
  # machine-specific path in configuration.
  llm_device_map: auto
  llm_torch_dtype: float16
  llm_max_new_tokens: 48
  llm_temperature: 0.0
  llm_top_p: 0.9
  llm_timeout_sec: 2.0
  llm_history_turns: 3
  llm_max_context_chars: 2400
  llm_answer_word_limit: 40
  llm_streaming: true
  llm_async_refine: true
  llm_load_on_start: false
  llm_fallback_to_template: true
  llm_grounding_guard_enabled: true
  llm_trust_remote_code: true

claim_verifier:
  enabled: true
  evidence_scorer_path: models/assistant/evidence_scorer.json
  support_threshold: 0.35
  contradiction_threshold: 0.35
  counterfactual_margin: 0.0
  admissibility_gate_enabled: true
  memory_gate_enabled: true
  specialized_counterfactual_enabled: true
  prerequisite_bootstrap_enabled: true
  prerequisite_confirmation_frames: 2
  ema_decay: 0.55
  require_step_match_for_support: true
  family_confirmation_frames: 2

causal_evidence_bank:
  enabled: true
  proposal_model_path: models/assistant/step_proposal.joblib
  triage_model_path: models/assistant/claim_triage.joblib
  dinov2_repo: models/backbones/dinov2
  device: cuda:0
  load_encoder_on_start: true

edge_runtime:
  enabled: true
  profiling_enabled: true
  synchronize_cuda_for_timing: false
  target_perception_ms: 100.0
  target_answer_ms: 350.0
  detection_interval_stable: 2
  geometry_interval_stable: 6
  retrieval_interval_stable: 3
  memory_embedding_interval_stable: 6
  visual_probe_width: 160
  visual_change_threshold: 0.012
  max_geometry_age: 12
  max_memory_embedding_age: 12
  cold_start_frames: 2
  persistent_missing_patience: 2
  min_epistemic_gain: 0.02
  min_stage_evidence_value: 0.25

ui:
  enabled: true

runlog:
  save_dir: outputs/assistant/interactive
  detail_level: debug
  live_detail_level: sparse
  persist_temporal_tokens: true
